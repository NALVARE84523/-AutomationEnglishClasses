name: 📚 Agendar clases de inglés

on:
  schedule:
    # Todos los días a las 8:00am Colombia (UTC-5) = 13:00 UTC
    - cron: '0 13 * * *'
  
  # Permite ejecutar manualmente desde GitHub
  workflow_dispatch:

jobs:
  agendar:
    name: Agendar clases
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          pip install playwright pytz
          playwright install chromium
          playwright install-deps chromium

      - name: 🤖 Ejecutar agendador
        env:
          SMART_USUARIO: ${{ secrets.SMART_USUARIO }}
          SMART_PASSWORD: ${{ secrets.SMART_PASSWORD }}
          SMART_PLAN: ${{ secrets.SMART_PLAN }}
        run: python scheduler.py

      - name: 📸 Subir screenshot de error (si hay)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
          if-no-files-found: ignore
          retention-days: 7
